<!-- design plan
Color: reuse Deep Current tokens — cream #f7f2e8 ground, navy #131c2b, sage #3c6b4d, brass #c9903f, sage-300 #c3cdb9
Type: JetBrains Mono for all UI/labels (print-proof, technical feel), Fraunces for the panel headline
Layout: isometric three.js diorama, four houses in a 2x2 plot (Multimodal / LYZR / Women Who Build / Unacademy & Airlearn).
Roof archetypes: modern flat, modern shed, kerala tiered hip, french mansard. Clicking a house lifts its roof off
and opens that case study. Corner registration marks, swatch strip, theme toggle.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Esther Rachel: Case Study Room</title>
<meta name="description" content="Click a house to lift its roof and open a real marketing case study: Multimodal, LYZR AI, Women Who Build, and Unacademy &amp; Airlearn." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e8;
    --ink:#131c2b;
    --ink-soft:#6b6a5e;
    --line:#ddd1ba;
    --navy:#131c2b;
    --navy-2:#1c2d43;
    --sage:#3c6b4d;
    --sage-2:#6fa383;
    --sage-3:#c3cdb9;
    --brass:#c9903f;
    --panel-bg:#efe7d8;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a; --ink:#f2ede1; --ink-soft:#a6a89a; --line:#2c3234; --panel-bg:#1b2022;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --ink:#f2ede1; --ink-soft:#a6a89a; --line:#2c3234; --panel-bg:#1b2022;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
  }

  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; width:100%; height:100%; }

  #halftone{
    position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:0.05;
    background-image: radial-gradient(circle, var(--ink) 1px, transparent 1.2px);
    background-size: 5px 5px;
  }
  :root[data-theme="dark"] #halftone{ mix-blend-mode:screen; opacity:0.06; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #halftone{ mix-blend-mode:screen; opacity:0.06; } }

  .reg{ position:fixed; width:16px; height:16px; opacity:0.55; pointer-events:none; z-index:5; }
  .reg svg{ width:100%; height:100%; stroke:var(--ink); }
  .reg.tl{ top:18px; left:18px; }
  .reg.tr{ top:18px; right:18px; }
  .reg.bl{ bottom:18px; left:18px; }
  .reg.br{ bottom:18px; right:18px; }

  header{
    position:fixed; top:24px; left:32px; right:32px; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    flex-wrap:wrap; pointer-events:none;
  }
  header a, header .title{ pointer-events:auto; }
  .title{ font-size:13px; letter-spacing:0.04em; color:var(--ink); }
  .title strong{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:15px; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  header nav{ display:flex; gap:16px; }
  header nav a{ font-size:11px; letter-spacing:0.04em; color:var(--ink); text-decoration:none; border-bottom:1px solid transparent; }
  header nav a:hover{ border-bottom-color:var(--brass); color:var(--brass); }

  #swatches{
    position:fixed; bottom:22px; right:32px; z-index:5;
    display:flex; gap:5px; align-items:center;
  }
  #swatches span{ width:12px; height:12px; border-radius:2px; display:block; }

  #themeToggle{
    position:fixed; bottom:20px; left:32px; z-index:5;
    background:none; border:1px solid var(--line); border-radius:999px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); font-size:14px;
  }
  #themeToggle:hover{ border-color:var(--brass); color:var(--brass); }

  #panel{
    position:fixed; top:0; right:0; height:100%; width:min(440px, 92vw);
    background:var(--panel-bg); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform 0.35s ease;
    z-index:8; padding:88px 32px 60px; overflow-y:auto;
  }
  #panel.open{ transform:translateX(0); }
  #panel .kicker{ font-size:11px; letter-spacing:0.06em; color:var(--ink-soft); }
  #panel h2{ font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:8px 0 4px; color:var(--ink); }
  #panel .role{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  #panel ul{ padding-left:18px; margin:0; font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.6; }
  #panel li{ margin-bottom:10px; }
  #panel li strong{ color:var(--brass); font-family:'JetBrains Mono'; font-weight:500; }
  #panelClose{
    position:absolute; top:30px; right:32px; background:none; border:none;
    font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-soft); cursor:pointer;
  }
  #panelClose:hover{ color:var(--brass); }

  #panelBody{ font-family:'Inter',system-ui,sans-serif; }
  .panel-section{ margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .panel-section:first-child{ margin-top: 22px; }
  .panel-section h3{
    font-family:'Fraunces',serif; font-weight:500; font-style:italic;
    font-size:17px; margin:0 0 12px; color:var(--ink);
  }
  .panel-label{
    font-family:'JetBrains Mono'; font-size:10px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--brass); display:block; margin:14px 0 5px;
  }
  .panel-label:first-of-type{ margin-top:0; }
  .panel-body p{ font-size:14px; line-height:1.6; margin:0; color:var(--ink); }
  .panel-principle{
    font-family:'Fraunces',serif; font-style:italic; font-size:15px;
    line-height:1.5; margin:14px 0 0; padding:14px 16px; border-left:2px solid var(--brass);
    background: rgba(201,144,63,0.08); color: var(--ink);
  }
  #panelResultsHead{
    font-family:'JetBrains Mono'; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--ink-soft); margin:26px 0 12px;
    padding-top:22px; border-top:1px solid var(--line);
  }

  #tooltip{
    position:fixed; z-index:6; pointer-events:none; font-size:11px;
    background:var(--ink); color:var(--bg); padding:5px 9px; border-radius:6px;
    transform:translate(-50%,-130%); opacity:0; transition:opacity 0.15s ease;
    white-space:nowrap;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="halftone"></div>

<div class="reg tl"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg tr"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg bl"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg br"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>

<header>
  <div>
    <div class="title">esther rachel / <strong>case study room</strong></div>
    <div class="hint">click a house to lift its roof and open the case study. drag to look around.</div>
  </div>
  <nav>
    <a href="index.html">back to site</a>
    <a href="mailto:estherrachel29@gmail.com">email</a>
    <a href="https://calendar.app.google/FV8yc5FFpcigEkFE9" target="_blank" rel="noopener">book a call</a>
  </nav>
</header>

<div id="swatches"></div>
<button id="themeToggle" aria-label="Toggle theme">◐</button>
<div id="tooltip"></div>

<div id="panel">
  <button id="panelClose">close ✕</button>
  <div class="kicker" id="panelTag"></div>
  <h2 id="panelName"></h2>
  <div class="role" id="panelRole"></div>
  <div id="panelBody"></div>
  <div id="panelResultsHead">Results</div>
  <ul id="panelList"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var ROOMS = {
    multimodal: {
      tag: 'Agentic AI · Fintech', name: 'Multimodal', role: 'Marketing Consultant, Social Media Manager',
      sections: [
        {
          context: "Multimodal sells agentic AI into financial institutions. The buying audience is more senior, more risk-aware, and less responsive to youth-oriented trend marketing than a consumer app audience.",
          objective: "Make a highly technical category understandable, credible, and trustworthy to non-technical financial-services decision-makers.",
          focus: "Audience-specific positioning, professional visual systems, industry-native language, educational content, and people-led trust building.",
          strategy: [
            "Use clean, highly designed, professional creative rather than chasing every viral format.",
            "Speak the language of the industry &mdash; translate AI terminology into the workflows, risks, and outcomes financial-services leaders already understand.",
            "Humanize the brand by putting recognizable operators, customers, and experts in front of it, since an abstract technical company is harder to trust.",
            "Build authority through people-forward initiatives like an advisory board, to attach credible human judgment to a technical product.",
            "Favor proof, education, and professionalism over content designed purely for reach &mdash; the goal is to make the company easier to evaluate, not simply more visible."
          ],
          principle: "B2B marketing for regulated financial institutions is a trust problem before it's a virality problem. The content has to reduce perceived risk, demonstrate fluency in the buyer's world, and put credible humans around the technology."
        }
      ],
      results: [
        'Grew LinkedIn engagement <strong>13x</strong> in 5 months while leading strategy through a Series A funding push, and drove an average of <strong>50K</strong> monthly impressions on X.',
        "Repositioned the company page around a people-first, advisory-board format after diagnosing that this industry's audience (average age 53) responds to trusted faces, not product claims.",
        'One advisory-board post cycle pulled <strong>410 reactions and 60 comments</strong> on a 2,897-follower page. Over the following 30 days: <strong>714 reactions (+276% MoM)</strong> and <strong>119 new followers (+129% MoM)</strong>.',
        'Ranked <strong>#1</strong> in the competitive set on reactions-per-follower, roughly <strong>3x</strong> the next closest account, with the smallest audience in the group.'
      ]
    },
    lyzr: {
      tag: 'Enterprise AI', name: 'LYZR AI', role: 'Business Consultant',
      sections: [
        {
          context: "Lyzr was in an early funding and growth stage &mdash; a still-small team, a strong push for market visibility, and a fast-moving, founder-led culture.",
          objective: "Create far more distribution than the company page alone could generate, without a large paid media engine.",
          focus: "Internal relationship-building, employee advocacy, account-level publishing support, tracking, and incentive design.",
          strategy: [
            "Company-page content has a natural reach ceiling, so the strategy was to turn the people inside the company into a network of credible publishing nodes, not simply “post more from the brand.”",
            "Started with trust inside a hybrid/remote team, building individual relationships before asking anyone for consistent participation.",
            "Grew and managed a personal-account network that started around 50 people and reached roughly 70, so distribution never depended on one founder or the company page.",
            "Built a tracker that made participation visible: posting at least once a week kept someone active in the program.",
            "Used consistency-based recognition to encourage posting streaks and coordinated enough participation that one idea could be shared across many accounts at once."
          ],
          principle: "When a startup needs reach but doesn't yet have a massive brand audience, distribution can be built from the inside out. A coordinated employee network can outperform a company page by compounding many small audiences &mdash; 100 impressions across 50 accounts is roughly 5,000 distributed impressions before any secondary sharing."
        }
      ],
      results: [
        'Ran <strong>70+</strong> LinkedIn accounts plus personal branding for the CEO, Co-Founder, and Head of Partnerships.',
        'Organized strategic partnership logistics and events with AWS and NVIDIA, including AWS NYC Summit 2025 and NYC Tech Week.',
        'Delivered monthly webinars averaging <strong>700+ registrations</strong> per event.',
        'Contributed to LYZR winning the <strong>AWS Gen AI Competency 2025</strong> award.'
      ]
    },
    womenwhobuild: {
      tag: 'Media · Community', name: 'Women Who Build', role: 'Lead Copywriter (freelance)',
      sections: [
        {
          context: "The business was built around expertise and information. A podcast was the main content engine, drawing people into the founder's ecosystem and supporting lead generation.",
          objective: "Create a consistent LinkedIn presence without reinventing the format for every post.",
          focus: "LinkedIn publishing, repeatable editorial formats, repeatable design, and ongoing performance review.",
          strategy: [
            "Developed a repeatable LinkedIn post structure that matched the founder's audience and made expertise easy to consume.",
            "Built a repeatable visual template so the design stayed recognizable while cutting production effort.",
            "Used the podcast as the source of ideas, arguments, and stories that fed LinkedIn, instead of treating every channel as a separate content operation.",
            "Published consistently, reviewed what resonated, and adjusted the template based on actual audience behavior.",
            "Kept the quality bar high &mdash; for an expertise-led brand, credibility and clarity mattered more than raw posting volume."
          ],
          principle: "For an expertise-led personal brand, the strongest content system is a repeatable editorial format built around one deep source of insight, not a constant stream of unrelated ideas."
        }
      ],
      results: [
        'Grew LinkedIn and daily newsletter impressions as high as <strong>800%</strong> in a single month.',
        'Produced interviews with senior operators including a former Coursera CMO and a BNP Paribas Managing Director.',
        'The podcast worked as the deeper trust layer while LinkedIn created repeated, lighter-weight exposure &mdash; each channel fed the other.'
      ]
    },
    unacademy: {
      tag: 'EdTech', name: 'Unacademy & Airlearn', role: 'Brand Marketing (contract)',
      sections: [
        {
          context: "Airlearn was a newer language-learning brand in a category where Duolingo was the clearest reference point for content and brand behavior. The audience skewed much younger than the B2B work &mdash; native to Reels, short-form video, trend cycles, and creator-led discovery.",
          objective: "Build awareness quickly and increase the odds of breakout content through volume, iteration, and creator distribution.",
          focus: "Content strategy, short-form distribution, competitive pattern recognition, and micro-influencer activation.",
          strategy: [
            "Used Duolingo as a competitive reference point, not to copy it, but to understand which formats and publishing behaviors already worked in the category.",
            "Prioritized volume: daily publishing and far more creative output than a conventional B2B content calendar.",
            "Sourced short (7&ndash;8 second) videos in bulk from micro-influencers rather than putting a large budget behind a few assets, and compared them on a cost-per-thousand-views basis.",
            "Treated content as an iterative system &mdash; publish, observe what earns attention, reuse the pattern, and discard what consistently underperforms.",
            "Kept content feeling native to the platform rather than obviously manufactured from a rigid brand template."
          ],
          principle: "For a young, trend-native audience, speed of learning can matter more than perfection. High content volume creates more chances to discover what the market responds to &mdash; when you publish enough credible variations, not every asset has to win."
        }
      ],
      results: [
        "Grew Unacademy's social presence <strong>750%</strong> in the first month on the account.",
        'Ran a paid Instagram acquisition push and closed Twitter influencer partnerships for the wider Airlearn campaign.',
        'Handled Twitter content that hit <strong>2.2M impressions</strong> in a single month, plus contract and finance management for creator partnerships.'
      ]
    }
  };

  function getTheme(){
    try { return localStorage.getItem('rbr-theme'); } catch(e){ return null; }
  }
  function setTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); } else { document.documentElement.removeAttribute('data-theme'); }
    try { localStorage.setItem('rbr-theme', t || ''); } catch(e){}
  }
  var savedTheme = getTheme();
  if(savedTheme) setTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effectiveDark = current === 'dark' || (!current && prefersDark);
    setTheme(effectiveDark ? 'light' : 'dark');
  });

  var swatchColors = ['#131c2b','#34506f','#3c6b4d','#6fa383','#c9903f','#c3cdb9'];
  var swatchEl = document.getElementById('swatches');
  swatchColors.forEach(function(c){
    var s = document.createElement('span');
    s.style.background = c;
    swatchEl.appendChild(s);
  });

  var panel = document.getElementById('panel');
  var openKey = null;
  function openPanel(key){
    var r = ROOMS[key];
    if(!r) return;
    openKey = key;
    document.getElementById('panelTag').textContent = r.tag;
    document.getElementById('panelName').textContent = r.name;
    document.getElementById('panelRole').textContent = r.role;

    var body = document.getElementById('panelBody');
    body.innerHTML = '';
    r.sections.forEach(function(s){
      var section = document.createElement('div');
      section.className = 'panel-section';

      if (s.heading) {
        var h = document.createElement('h3');
        h.textContent = s.heading;
        section.appendChild(h);
      }

      var pbody = document.createElement('div');
      pbody.className = 'panel-body';

      var contextLabel = document.createElement('span');
      contextLabel.className = 'panel-label';
      contextLabel.textContent = 'Context';
      pbody.appendChild(contextLabel);
      var contextP = document.createElement('p');
      contextP.innerHTML = s.context;
      pbody.appendChild(contextP);

      var objLabel = document.createElement('span');
      objLabel.className = 'panel-label';
      objLabel.textContent = 'Objective';
      pbody.appendChild(objLabel);
      var objP = document.createElement('p');
      objP.innerHTML = s.objective;
      pbody.appendChild(objP);

      if (s.focus) {
        var focusLabel = document.createElement('span');
        focusLabel.className = 'panel-label';
        focusLabel.textContent = 'My focus';
        pbody.appendChild(focusLabel);
        var focusP = document.createElement('p');
        focusP.innerHTML = s.focus;
        pbody.appendChild(focusP);
      }

      var stratLabel = document.createElement('span');
      stratLabel.className = 'panel-label';
      stratLabel.textContent = 'Strategy';
      pbody.appendChild(stratLabel);
      var stratList = document.createElement('ul');
      s.strategy.forEach(function(item){
        var li = document.createElement('li');
        li.innerHTML = item;
        stratList.appendChild(li);
      });
      pbody.appendChild(stratList);

      var principle = document.createElement('div');
      principle.className = 'panel-principle';
      principle.innerHTML = s.principle;
      pbody.appendChild(principle);

      section.appendChild(pbody);
      body.appendChild(section);
    });

    var list = document.getElementById('panelList');
    list.innerHTML = '';
    r.results.forEach(function(b){
      var li = document.createElement('li');
      li.innerHTML = b;
      list.appendChild(li);
    });

    panel.scrollTop = 0;
    panel.classList.add('open');
  }
  document.getElementById('panelClose').addEventListener('click', function(){
    panel.classList.remove('open');
    openKey = null;
  });

  var stage = document.getElementById('stage');
  var scene = new THREE.Scene();

  var aspect = window.innerWidth / window.innerHeight;
  var d = 4.6;
  var camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 0.1, 100);
  camera.position.set(9, 9, 9);
  camera.lookAt(0, 0.6, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var sun = new THREE.DirectionalLight(0xfff2dd, 0.9);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  var COLORS = {
    navy: 0x131c2b, navy2: 0x1c2d43, sage: 0x3c6b4d, sage2: 0x6fa383,
    brass: 0xc9903f, sand: 0xefe7d8, sage3: 0xc3cdb9
  };

  // ---------- fog + theme-aware background ----------
  var FOG_LIGHT = 0xf7f2e8, FOG_DARK = 0x14181a;
  scene.fog = new THREE.Fog(FOG_LIGHT, 10, 23);

  function currentIsDark(){
    var t = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    return t === 'dark' || (!t && prefersDark);
  }
  function syncSceneTheme(){
    scene.fog.color.setHex(currentIsDark() ? FOG_DARK : FOG_LIGHT);
  }
  syncSceneTheme();
  document.getElementById('themeToggle').addEventListener('click', function(){ setTimeout(syncSceneTheme, 0); });
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncSceneTheme);
  }

  // ---------- soft grid floor, like a diorama base ----------
  var grid = new THREE.GridHelper(26, 26, COLORS.navy2, COLORS.navy2);
  grid.position.y = -0.02;
  grid.material.transparent = true;
  grid.material.opacity = 0.14;
  scene.add(grid);

  // ---------- floating ambient particles ----------
  function circleTexture(){
    var c = document.createElement('canvas'); c.width = c.height = 32;
    var ctx = c.getContext('2d');
    var grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(c);
  }
  var particleCount = 46;
  var particlePositions = new Float32Array(particleCount * 3);
  var particleColorsArr = new Float32Array(particleCount * 3);
  var particlePhase = [];
  var paletteTints = [
    new THREE.Color(COLORS.navy2), new THREE.Color(COLORS.sage2), new THREE.Color(COLORS.brass)
  ];
  for (var p = 0; p < particleCount; p++) {
    var px = (Math.random() - 0.5) * 16;
    var pz = (Math.random() - 0.5) * 16;
    var py = Math.random() * 4 + 0.3;
    particlePositions[p * 3] = px; particlePositions[p * 3 + 1] = py; particlePositions[p * 3 + 2] = pz;
    var tint = paletteTints[p % paletteTints.length];
    particleColorsArr[p * 3] = tint.r; particleColorsArr[p * 3 + 1] = tint.g; particleColorsArr[p * 3 + 2] = tint.b;
    particlePhase.push({ speed: 0.3 + Math.random() * 0.4, offset: Math.random() * Math.PI * 2, baseY: py });
  }
  var particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColorsArr, 3));
  var particleMat = new THREE.PointsMaterial({
    size: 0.11, map: circleTexture(), transparent: true, opacity: 0.55,
    vertexColors: true, depthWrite: false, sizeAttenuation: true
  });
  var particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  var roomGroups = {};
  var animatedRooms = [];
  var vibeAnimTargets = [];

  function addVibeProps(group, vibe){
    if (vibe === 'credibility') {
      var gem = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.16, 0),
        new THREE.MeshStandardMaterial({ color: COLORS.brass, roughness: 0.3, metalness: 0.2 })
      );
      gem.position.set(0, 2.3, 0);
      gem.userData.spin = 0.6;
      gem.userData.baseY = 2.3;
      gem.userData.bob = { speed: 1.1, amp: 0.06, offset: Math.random() * Math.PI * 2 };
      group.add(gem);
      vibeAnimTargets.push(gem);

    } else if (vibe === 'growth') {
      var heights = [0.22, 0.4, 0.6];
      for (var i = 0; i < 3; i++) {
        var bar = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, heights[i], 0.16),
          new THREE.MeshStandardMaterial({ color: i % 2 ? COLORS.sage2 : COLORS.brass, roughness: 0.6 })
        );
        bar.position.set(0.55 + i * 0.24, 0.12 + heights[i] / 2, -1.35);
        bar.userData.pulse = { base: heights[i], speed: 1.4 + i * 0.2, offset: i * 0.8, ground: 0.12, amp: 0.28 };
        group.add(bar);
        vibeAnimTargets.push(bar);
      }

    } else if (vibe === 'creative') {
      var cardColors = [COLORS.navy2, COLORS.sage2, COLORS.brass];
      for (var j = 0; j < 3; j++) {
        var card = new THREE.Mesh(
          new THREE.PlaneGeometry(0.26, 0.34),
          new THREE.MeshStandardMaterial({ color: cardColors[j], roughness: 0.5, side: THREE.DoubleSide })
        );
        card.userData.orbit = { radius: 0.55, speed: 0.5 + j * 0.15, offset: j * (Math.PI * 2 / 3), height: 2.85 + j * 0.1 };
        group.add(card);
        vibeAnimTargets.push(card);
      }

    } else if (vibe === 'volume') {
      // a stack of thin plates, for the high-volume publishing story
      var plateColors = [COLORS.brass, COLORS.sage2, COLORS.brass, COLORS.sage2, COLORS.brass];
      for (var k = 0; k < 5; k++) {
        var plate = new THREE.Mesh(
          new THREE.BoxGeometry(0.42, 0.045, 0.42),
          new THREE.MeshStandardMaterial({ color: plateColors[k], roughness: 0.6 })
        );
        var plateY = 2.6 + k * 0.13;
        plate.position.set(0, plateY, 0);
        plate.rotation.y = k * 0.22;
        plate.userData.baseY = plateY;
        plate.userData.bob = { speed: 1.0 + k * 0.12, amp: 0.05, offset: k * 0.55 };
        plate.userData.spin = 0.25;
        group.add(plate);
        vibeAnimTargets.push(plate);
      }
    }
  }

  // Roof archetypes: modern flat, modern shed (mono-pitch), french mansard,
  // kerala tiered hip. Each roof is its own group so it can lift off on click.
  function buildRoof(type, color){
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.65 });
    var trimMat = new THREE.MeshStandardMaterial({ color: COLORS.brass, roughness: 0.4, metalness: 0.15 });
    var bandMat = new THREE.MeshStandardMaterial({ color: COLORS.navy2, roughness: 0.8 });
    var eaveY = 1.12;

    if (type === 'modern-flat') {
      // Flat slab with a slight overhang and a low parapet: clean, restrained lines.
      var slab = new THREE.Mesh(new THREE.BoxGeometry(2.24, 0.1, 2.24), mat);
      slab.position.y = eaveY + 0.05;
      g.add(slab);

      var parapetY = eaveY + 0.1 + 0.08;
      var edge = 1.12 - 0.03;
      var pFront = new THREE.Mesh(new THREE.BoxGeometry(2.24, 0.16, 0.06), mat);
      pFront.position.set(0, parapetY, edge);
      g.add(pFront);
      var pBack = new THREE.Mesh(new THREE.BoxGeometry(2.24, 0.16, 0.06), mat);
      pBack.position.set(0, parapetY, -edge);
      g.add(pBack);
      var pLeft = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 2.24), mat);
      pLeft.position.set(-edge, parapetY, 0);
      g.add(pLeft);
      var pRight = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 2.24), mat);
      pRight.position.set(edge, parapetY, 0);
      g.add(pRight);

      var trimLine = new THREE.Mesh(new THREE.BoxGeometry(2.26, 0.03, 0.03), trimMat);
      trimLine.position.set(0, parapetY + 0.09, edge);
      g.add(trimLine);

    } else if (type === 'modern-shed') {
      // Single-slope mono-pitch roof: the other half of the modern vocabulary.
      var rise = 0.52, depth = 2.3;
      var shedTilt = Math.atan2(rise, depth);
      var shedLen = depth / Math.cos(shedTilt);
      var shed = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.09, shedLen), mat);
      shed.rotation.x = -shedTilt;
      shed.position.y = eaveY + rise / 2 + 0.05;
      g.add(shed);

      var fascia = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.07, 0.07), trimMat);
      fascia.position.set(0, eaveY + 0.02, depth / 2 - 0.02);
      g.add(fascia);

    } else if (type === 'french') {
      // Mansard: steep lower slope, shallower upper slope, flat cap.
      var lower = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 1.6, 0.62, 4), mat);
      lower.rotation.y = Math.PI / 4;
      lower.position.y = eaveY + 0.31;
      g.add(lower);

      var upper = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.72, 0.28, 4), mat);
      upper.rotation.y = Math.PI / 4;
      upper.position.y = eaveY + 0.62 + 0.14;
      g.add(upper);

      var cap = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.06, 0.42), mat);
      cap.rotation.y = Math.PI / 4;
      cap.position.y = eaveY + 0.9 + 0.03;
      g.add(cap);

      var frenchFinial = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.18, 8), trimMat);
      frenchFinial.position.y = eaveY + 0.93 + 0.09;
      g.add(frenchFinial);

    } else if (type === 'kerala') {
      // Two-tier hip roof with deep overhanging eaves and a clerestory band.
      var lowerHip = new THREE.Mesh(new THREE.ConeGeometry(1.95, 0.5, 4), mat);
      lowerHip.rotation.y = Math.PI / 4;
      lowerHip.position.y = eaveY + 0.25;
      g.add(lowerHip);

      var band = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.18, 4), bandMat);
      band.rotation.y = Math.PI / 4;
      band.position.y = eaveY + 0.5 + 0.09;
      g.add(band);

      var upperHip = new THREE.Mesh(new THREE.ConeGeometry(1.05, 0.42, 4), mat);
      upperHip.rotation.y = Math.PI / 4;
      upperHip.position.y = eaveY + 0.68 + 0.21;
      g.add(upperHip);

      var keralaFinial = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), trimMat);
      keralaFinial.position.y = eaveY + 0.89 + 0.16;
      g.add(keralaFinial);
      var spike = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.16, 8), trimMat);
      spike.position.y = eaveY + 0.89 + 0.3;
      g.add(spike);
    }
    return g;
  }

  function room(x, z, wallColor, roofColor, key, roofType, vibe){
    var group = new THREE.Group();
    group.position.set(x, 0, z);

    var floor = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.12, 2),
      new THREE.MeshStandardMaterial({ color: COLORS.sand, roughness: 0.9 })
    );
    floor.position.y = 0.06;
    group.add(floor);

    var wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.85 });
    var wallBack = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.1), wallMat);
    wallBack.position.set(0, 0.62, -0.95);
    group.add(wallBack);
    var wallSide = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 2), wallMat);
    wallSide.position.set(-0.95, 0.62, 0);
    group.add(wallSide);

    var roofGroup = buildRoof(roofType, roofColor);
    group.add(roofGroup);
    addVibeProps(group, vibe);

    roomGroups[key] = group;
    animatedRooms.push({
      group: group, key: key, phase: Math.random() * Math.PI * 2,
      roofGroup: roofGroup, roofLift: 0
    });

    var propMat = new THREE.MeshStandardMaterial({ color: COLORS.navy2, roughness: 0.6 });
    for (var i = 0; i < 3; i++) {
      var prop = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28 + i * 0.12, 0.28), propMat);
      prop.position.set(-0.35 + i * 0.38, 0.14 + (0.28 + i * 0.12) / 2, 0.35);
      group.add(prop);
    }

    var hit = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 1.3, 2.1),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.position.y = 0.6;
    hit.userData.key = key;
    group.add(hit);

    scene.add(group);
    return group;
  }

  room(-1.15, -1.15, COLORS.navy, COLORS.navy2, 'multimodal', 'modern-flat', 'credibility');
  room(1.15, -1.15, COLORS.sage, COLORS.sage3, 'lyzr', 'modern-shed', 'growth');
  room(-1.15, 1.15, COLORS.brass, COLORS.sand, 'womenwhobuild', 'kerala', 'creative');
  room(1.15, 1.15, COLORS.navy2, COLORS.brass, 'unacademy', 'french', 'volume');

  var TOOLTIP_LABELS = {
    multimodal: 'multimodal',
    lyzr: 'lyzr ai',
    womenwhobuild: 'women who build',
    unacademy: 'unacademy & airlearn'
  };

  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var tooltip = document.getElementById('tooltip');

  var isDragging = false, prev = { x: 0, y: 0 };
  var yaw = 0, targetYaw = 0, autoRotate = 0;
  var hoveredKey = null;

  function setMouse(clientX, clientY){
    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function hitTest(){
    raycaster.setFromCamera(mouse, camera);
    var intersects = raycaster.intersectObjects(scene.children, true);
    for (var i = 0; i < intersects.length; i++) {
      if (intersects[i].object.userData && intersects[i].object.userData.key) {
        return intersects[i].object.userData.key;
      }
    }
    return null;
  }

  renderer.domElement.addEventListener('pointerdown', function(e){
    isDragging = true; prev.x = e.clientX; prev.y = e.clientY;
  });
  window.addEventListener('pointerup', function(){ isDragging = false; });
  window.addEventListener('pointermove', function(e){
    setMouse(e.clientX, e.clientY);
    if (isDragging) {
      targetYaw += (e.clientX - prev.x) * 0.005;
      prev.x = e.clientX; prev.y = e.clientY;
      tooltip.style.opacity = 0;
      return;
    }
    var key = hitTest();
    hoveredKey = key;
    renderer.domElement.style.cursor = key ? 'pointer' : 'grab';
    if (key) {
      tooltip.style.opacity = 1;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
      tooltip.textContent = TOOLTIP_LABELS[key] || key;
    } else {
      tooltip.style.opacity = 0;
    }
  });
  renderer.domElement.addEventListener('click', function(e){
    setMouse(e.clientX, e.clientY);
    var key = hitTest();
    if (key) openPanel(key);
  });

  window.addEventListener('resize', function(){
    aspect = window.innerWidth / window.innerHeight;
    camera.left = -d * aspect; camera.right = d * aspect;
    camera.top = d; camera.bottom = -d;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var radius = Math.sqrt(9*9 + 9*9);
  function animate(){
    requestAnimationFrame(animate);
    var t = performance.now() * 0.001;

    autoRotate += 0.0011;
    yaw += (targetYaw - yaw) * 0.08;
    var angle = Math.PI / 4 + yaw + autoRotate;
    camera.position.x = Math.sin(angle) * radius;
    camera.position.z = Math.cos(angle) * radius;
    camera.position.y = 9;
    camera.lookAt(0, 0.5, 0);

    animatedRooms.forEach(function(r){
      r.group.position.y = Math.sin(t * 0.8 + r.phase) * 0.035;
      var targetScale = (hoveredKey === r.key) ? 1.06 : 1.0;
      r.group.scale.x += (targetScale - r.group.scale.x) * 0.12;
      r.group.scale.y += (targetScale - r.group.scale.y) * 0.12;
      r.group.scale.z += (targetScale - r.group.scale.z) * 0.12;

      // roof lifts off while this room's case study is open
      var liftTarget = (openKey === r.key) ? 1 : 0;
      r.roofLift += (liftTarget - r.roofLift) * 0.09;
      r.roofGroup.position.y = r.roofLift * 1.45 + r.roofLift * Math.sin(t * 1.4) * 0.03;
      r.roofGroup.rotation.y = r.roofLift * 0.4;
    });

    vibeAnimTargets.forEach(function(o){
      if (o.userData.spin) o.rotation.y += o.userData.spin * 0.016;
      if (o.userData.bob) {
        o.position.y = o.userData.baseY + Math.sin(t * o.userData.bob.speed + o.userData.bob.offset) * o.userData.bob.amp;
      }
      if (o.userData.pulse) {
        var pu = o.userData.pulse;
        var h = pu.base * (1 + pu.amp * Math.sin(t * pu.speed + pu.offset));
        o.scale.y = h / pu.base;
        o.position.y = pu.ground + h / 2;
      }
      if (o.userData.orbit) {
        var ob = o.userData.orbit;
        var a = t * ob.speed + ob.offset;
        o.position.x = Math.cos(a) * ob.radius;
        o.position.z = Math.sin(a) * ob.radius;
        o.position.y = ob.height + Math.sin(t * 1.3 + ob.offset) * 0.05;
        o.rotation.y = a;
      }
    });

    var posAttr = particleGeo.attributes.position;
    for (var pi = 0; pi < particleCount; pi++) {
      var ph = particlePhase[pi];
      posAttr.array[pi * 3 + 1] = ph.baseY + Math.sin(t * ph.speed + ph.offset) * 0.4;
    }
    posAttr.needsUpdate = true;
    particles.rotation.y = t * 0.015;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
