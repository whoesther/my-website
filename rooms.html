<!-- design plan
Color: reuse Deep Current tokens — cream #f7f2e8 ground, navy #131c2b, sage #3c6b4d, brass #c9903f, sage-300 #c3cdb9
Type: JetBrains Mono for all UI/labels (print-proof, technical feel), Fraunces for the panel headline
Layout: isometric three.js diorama, 3 solid "rooms" (Multimodal / LYZR / Freelance work) + 1 empty dashed plot, corner registration marks, swatch strip, theme toggle, click-to-open case-study panel
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Esther Rachel: Room by Room</title>
<meta name="description" content="Click a room to open a real marketing case study — Multimodal, LYZR AI, and freelance/contract work." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e8;
    --ink:#131c2b;
    --ink-soft:#6b6a5e;
    --line:#ddd1ba;
    --navy:#131c2b;
    --navy-2:#1c2d43;
    --sage:#3c6b4d;
    --sage-2:#6fa383;
    --sage-3:#c3cdb9;
    --brass:#c9903f;
    --panel-bg:#efe7d8;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a; --ink:#f2ede1; --ink-soft:#a6a89a; --line:#2c3234; --panel-bg:#1b2022;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a; --ink:#f2ede1; --ink-soft:#a6a89a; --line:#2c3234; --panel-bg:#1b2022;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    overflow:hidden;
  }

  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; width:100%; height:100%; }

  #halftone{
    position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:0.05;
    background-image: radial-gradient(circle, var(--ink) 1px, transparent 1.2px);
    background-size: 5px 5px;
  }
  :root[data-theme="dark"] #halftone{ mix-blend-mode:screen; opacity:0.06; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #halftone{ mix-blend-mode:screen; opacity:0.06; } }

  .reg{ position:fixed; width:16px; height:16px; opacity:0.55; pointer-events:none; z-index:5; }
  .reg svg{ width:100%; height:100%; stroke:var(--ink); }
  .reg.tl{ top:18px; left:18px; }
  .reg.tr{ top:18px; right:18px; }
  .reg.bl{ bottom:18px; left:18px; }
  .reg.br{ bottom:18px; right:18px; }

  header{
    position:fixed; top:24px; left:32px; right:32px; z-index:5;
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    flex-wrap:wrap; pointer-events:none;
  }
  header a, header .title{ pointer-events:auto; }
  .title{ font-size:13px; letter-spacing:0.04em; color:var(--ink); }
  .title strong{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:15px; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  header nav{ display:flex; gap:16px; }
  header nav a{ font-size:11px; letter-spacing:0.04em; color:var(--ink); text-decoration:none; border-bottom:1px solid transparent; }
  header nav a:hover{ border-bottom-color:var(--brass); color:var(--brass); }

  #swatches{
    position:fixed; bottom:22px; right:32px; z-index:5;
    display:flex; gap:5px; align-items:center;
  }
  #swatches span{ width:12px; height:12px; border-radius:2px; display:block; }

  #themeToggle{
    position:fixed; bottom:20px; left:32px; z-index:5;
    background:none; border:1px solid var(--line); border-radius:999px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); font-size:14px;
  }
  #themeToggle:hover{ border-color:var(--brass); color:var(--brass); }

  #panel{
    position:fixed; top:0; right:0; height:100%; width:min(360px, 88vw);
    background:var(--panel-bg); border-left:1px solid var(--line);
    transform:translateX(100%); transition:transform 0.35s ease;
    z-index:8; padding:88px 30px 30px; overflow-y:auto;
  }
  #panel.open{ transform:translateX(0); }
  #panel .kicker{ font-size:11px; letter-spacing:0.06em; color:var(--ink-soft); }
  #panel h2{ font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:8px 0 4px; color:var(--ink); }
  #panel .role{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  #panel ul{ padding-left:18px; margin:0; font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.6; }
  #panel li{ margin-bottom:12px; }
  #panel li strong{ color:var(--brass); font-family:'JetBrains Mono'; font-weight:500; }
  #panelClose{
    position:absolute; top:30px; right:30px; background:none; border:none;
    font-family:'JetBrains Mono'; font-size:12px; color:var(--ink-soft); cursor:pointer;
  }
  #panelClose:hover{ color:var(--brass); }

  #tooltip{
    position:fixed; z-index:6; pointer-events:none; font-size:11px;
    background:var(--ink); color:var(--bg); padding:5px 9px; border-radius:6px;
    transform:translate(-50%,-130%); opacity:0; transition:opacity 0.15s ease;
    white-space:nowrap;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="halftone"></div>

<div class="reg tl"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg tr"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg bl"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>
<div class="reg br"><svg viewBox="0 0 16 16"><path d="M8 0V16M0 8H16" fill="none" stroke-width="1"/></svg></div>

<header>
  <div>
    <div class="title">esther rachel / <strong>room by room</strong></div>
    <div class="hint">click a room to open the case study. drag to look around.</div>
  </div>
  <nav>
    <a href="index.html">back to site</a>
    <a href="mailto:estherrachel29@gmail.com">email</a>
    <a href="https://calendar.app.google/FV8yc5FFpcigEkFE9" target="_blank" rel="noopener">book a call</a>
  </nav>
</header>

<div id="swatches"></div>
<button id="themeToggle" aria-label="Toggle theme">◐</button>
<div id="tooltip"></div>

<div id="panel">
  <button id="panelClose">close ✕</button>
  <div class="kicker" id="panelTag"></div>
  <h2 id="panelName"></h2>
  <div class="role" id="panelRole"></div>
  <ul id="panelList"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var ROOMS = {
    multimodal: {
      tag: 'Agentic AI · Fintech', name: 'Multimodal', role: 'Marketing Consultant, Social Media Manager',
      bullets: [
        'Grew LinkedIn engagement <strong>13x</strong> in 5 months while leading strategy through a Series A funding push, and drove an average of <strong>50K</strong> monthly impressions on X.',
        "Repositioned the company page around a people-first, advisory-board format after diagnosing that this industry's audience (average age 53) responds to trusted faces, not product claims.",
        'One advisory-board post cycle pulled <strong>410 reactions and 60 comments</strong> on a 2,897-follower page. Over the following 30 days: <strong>714 reactions (+276% MoM)</strong> and <strong>119 new followers (+129% MoM)</strong>.',
        'Ranked <strong>#1</strong> in the competitive set on reactions-per-follower, roughly <strong>3x</strong> the next closest account, with the smallest audience in the group.'
      ]
    },
    lyzr: {
      tag: 'Enterprise AI', name: 'LYZR AI', role: 'Business Consultant',
      bullets: [
        'Ran <strong>70+</strong> LinkedIn accounts plus personal branding for the CEO, Co-Founder, and Head of Partnerships.',
        'Organized strategic partnership logistics and events with AWS and NVIDIA, including AWS NYC Summit 2025 and NYC Tech Week.',
        'Delivered monthly webinars averaging <strong>700+ registrations</strong> per event.',
        'Contributed to LYZR winning the <strong>AWS Gen AI Competency 2025</strong> award.'
      ]
    },
    freelance: {
      tag: 'Freelance & Contract', name: 'Women Who Build, Unacademy & Airlearn', role: 'Copywriter / Brand Marketing',
      bullets: [
        'Grew LinkedIn and daily newsletter impressions as high as <strong>800%</strong> in a single month for Women Who Build.',
        'Produced interviews with senior operators including a former Coursera CMO and a BNP Paribas Managing Director.',
        "Grew Unacademy's social presence <strong>750%</strong> in the first month on the account.",
        'Ran a paid Instagram push and closed Twitter influencer deals for Airlearn, contributing to <strong>2.2M</strong> Twitter impressions in one month.'
      ]
    }
  };

  function getTheme(){
    try { return localStorage.getItem('rbr-theme'); } catch(e){ return null; }
  }
  function setTheme(t){
    if(t){ document.documentElement.setAttribute('data-theme', t); } else { document.documentElement.removeAttribute('data-theme'); }
    try { localStorage.setItem('rbr-theme', t || ''); } catch(e){}
  }
  var savedTheme = getTheme();
  if(savedTheme) setTheme(savedTheme);
  document.getElementById('themeToggle').addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var effectiveDark = current === 'dark' || (!current && prefersDark);
    setTheme(effectiveDark ? 'light' : 'dark');
  });

  var swatchColors = ['#131c2b','#34506f','#3c6b4d','#6fa383','#c9903f','#c3cdb9'];
  var swatchEl = document.getElementById('swatches');
  swatchColors.forEach(function(c){
    var s = document.createElement('span');
    s.style.background = c;
    swatchEl.appendChild(s);
  });

  var panel = document.getElementById('panel');
  function openPanel(key){
    var r = ROOMS[key];
    if(!r) return;
    document.getElementById('panelTag').textContent = r.tag;
    document.getElementById('panelName').textContent = r.name;
    document.getElementById('panelRole').textContent = r.role;
    var list = document.getElementById('panelList');
    list.innerHTML = '';
    r.bullets.forEach(function(b){
      var li = document.createElement('li');
      li.innerHTML = b;
      list.appendChild(li);
    });
    panel.classList.add('open');
  }
  document.getElementById('panelClose').addEventListener('click', function(){
    panel.classList.remove('open');
  });

  var stage = document.getElementById('stage');
  var scene = new THREE.Scene();

  var aspect = window.innerWidth / window.innerHeight;
  var d = 6.5;
  var camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 0.1, 100);
  camera.position.set(9, 9, 9);
  camera.lookAt(0, 0.6, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var sun = new THREE.DirectionalLight(0xfff2dd, 0.9);
  sun.position.set(6, 10, 4);
  scene.add(sun);

  var COLORS = {
    navy: 0x131c2b, navy2: 0x1c2d43, sage: 0x3c6b4d, sage2: 0x6fa383,
    brass: 0xc9903f, sand: 0xefe7d8, sage3: 0xc3cdb9
  };

  function buildRoof(type, color){
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.65 });
    var finialMat = new THREE.MeshStandardMaterial({ color: COLORS.brass, roughness: 0.4, metalness: 0.15 });
    var eaveY = 1.12;

    if (type === 'pyramid') {
      var pyramid = new THREE.Mesh(new THREE.ConeGeometry(1.55, 0.85, 4), mat);
      pyramid.rotation.y = Math.PI / 4;
      pyramid.position.y = eaveY + 0.85 / 2;
      g.add(pyramid);
      var finial = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), finialMat);
      finial.position.y = eaveY + 0.85 + 0.09;
      g.add(finial);

    } else if (type === 'gable') {
      var halfBase = 1.15, roofRise = 0.55;
      var tilt = Math.atan2(roofRise, halfBase);
      var slopeLen = halfBase / Math.cos(tilt);
      var panelGeoA = new THREE.BoxGeometry(2.3, 0.06, slopeLen);
      panelGeoA.translate(0, 0, slopeLen / 2);
      var panelA = new THREE.Mesh(panelGeoA, mat);
      panelA.rotation.x = -tilt;
      panelA.position.y = eaveY;
      g.add(panelA);
      var panelGeoB = new THREE.BoxGeometry(2.3, 0.06, slopeLen);
      panelGeoB.translate(0, 0, -slopeLen / 2);
      var panelB = new THREE.Mesh(panelGeoB, mat);
      panelB.rotation.x = tilt;
      panelB.position.y = eaveY;
      g.add(panelB);
      var ridge = new THREE.Mesh(new THREE.BoxGeometry(2.32, 0.09, 0.09), finialMat);
      ridge.position.y = eaveY + roofRise + 0.045;
      g.add(ridge);

    } else if (type === 'cone') {
      var turret = new THREE.Mesh(new THREE.ConeGeometry(1.35, 0.95, 20), mat);
      turret.position.y = eaveY + 0.95 / 2;
      g.add(turret);
      var finialCone = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), finialMat);
      finialCone.position.y = eaveY + 0.95 + 0.09;
      g.add(finialCone);
    }
    return g;
  }

  function room(x, z, wallColor, roofColor, key, roofType){
    var group = new THREE.Group();
    group.position.set(x, 0, z);

    var floor = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.12, 2),
      new THREE.MeshStandardMaterial({ color: COLORS.sand, roughness: 0.9 })
    );
    floor.position.y = 0.06;
    group.add(floor);

    var wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.85 });
    var wallBack = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 0.1), wallMat);
    wallBack.position.set(0, 0.62, -0.95);
    group.add(wallBack);
    var wallSide = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 2), wallMat);
    wallSide.position.set(-0.95, 0.62, 0);
    group.add(wallSide);

    group.add(buildRoof(roofType, roofColor));

    var propMat = new THREE.MeshStandardMaterial({ color: COLORS.navy2, roughness: 0.6 });
    for (var i = 0; i < 3; i++) {
      var prop = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28 + i * 0.12, 0.28), propMat);
      prop.position.set(-0.35 + i * 0.38, 0.14 + (0.28 + i * 0.12) / 2, 0.35);
      group.add(prop);
    }

    var hit = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 1.3, 2.1),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.position.y = 0.6;
    hit.userData.key = key;
    group.add(hit);

    scene.add(group);
    return group;
  }

  function emptyPlot(x, z){
    var group = new THREE.Group();
    group.position.set(x, 0, z);
    var floor = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.04, 2),
      new THREE.MeshBasicMaterial({ color: COLORS.sand, transparent: true, opacity: 0.35 })
    );
    floor.position.y = 0.02;
    group.add(floor);

    var edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 0.04, 2)),
      new THREE.LineDashedMaterial({ color: COLORS.navy, dashSize: 0.12, gapSize: 0.08, transparent: true, opacity: 0.4 })
    );
    edges.position.y = 0.02;
    edges.computeLineDistances();
    group.add(edges);

    scene.add(group);
  }

  room(-1.05, -1.05, COLORS.navy, COLORS.brass, 'multimodal', 'pyramid');
  room(1.05, -1.05, COLORS.sage, COLORS.sage3, 'lyzr', 'gable');
  room(-1.05, 1.05, COLORS.brass, COLORS.sand, 'freelance', 'cone');
  emptyPlot(1.05, 1.05);

  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var tooltip = document.getElementById('tooltip');

  var isDragging = false, prev = { x: 0, y: 0 };
  var yaw = 0, targetYaw = 0;

  function setMouse(clientX, clientY){
    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function hitTest(){
    raycaster.setFromCamera(mouse, camera);
    var intersects = raycaster.intersectObjects(scene.children, true);
    for (var i = 0; i < intersects.length; i++) {
      if (intersects[i].object.userData && intersects[i].object.userData.key) {
        return intersects[i].object.userData.key;
      }
    }
    return null;
  }

  renderer.domElement.addEventListener('pointerdown', function(e){
    isDragging = true; prev.x = e.clientX; prev.y = e.clientY;
  });
  window.addEventListener('pointerup', function(){ isDragging = false; });
  window.addEventListener('pointermove', function(e){
    setMouse(e.clientX, e.clientY);
    if (isDragging) {
      targetYaw += (e.clientX - prev.x) * 0.005;
      prev.x = e.clientX; prev.y = e.clientY;
      tooltip.style.opacity = 0;
      return;
    }
    var key = hitTest();
    if (key) {
      tooltip.style.opacity = 1;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
      tooltip.textContent = key === 'multimodal' ? 'multimodal' : key === 'lyzr' ? 'lyzr ai' : 'women who build / unacademy / airlearn';
    } else {
      tooltip.style.opacity = 0;
    }
  });
  renderer.domElement.addEventListener('click', function(e){
    setMouse(e.clientX, e.clientY);
    var key = hitTest();
    if (key) openPanel(key);
  });

  window.addEventListener('resize', function(){
    aspect = window.innerWidth / window.innerHeight;
    camera.left = -d * aspect; camera.right = d * aspect;
    camera.top = d; camera.bottom = -d;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var radius = Math.sqrt(9*9 + 9*9);
  function animate(){
    requestAnimationFrame(animate);
    yaw += (targetYaw - yaw) * 0.08;
    var angle = Math.PI / 4 + yaw;
    camera.position.x = Math.sin(angle) * radius;
    camera.position.z = Math.cos(angle) * radius;
    camera.position.y = 9;
    camera.lookAt(0, 0.5, 0);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
